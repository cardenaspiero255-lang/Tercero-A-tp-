<script>const days=['Lunes','Martes','Miércoles','Jueves','Viernes'];
const timeSlots=[['08:00','08:45'],['08:45','09:30'],['09:30','09:50'],['09:50','10:35'],['10:35','11:20'],['11:20','11:40'],['11:40','12:25'],['12:25','13:10'],['13:10','13:55'],['13:55','14:40'],['14:40','15:25'],['15:25','16:10']];
const C=(subject,teacher='')=>({subject,teacher,type:'class'});
const B=(subject)=>({subject,teacher:'',type:'break'});
const plans=[
[C('Lenguaje','KM'),C('Lenguaje','KM'),B('Recreo'),C('Educación Ciudadana','LA'),C('Educación Ciudadana','LA'),B('Recreo'),C('Inglés','EP'),C('Inglés','EP'),B('Almuerzo'),C('Filosofía'),C('Filosofía'),C('Matemática','JG')],
[C('CYPESDA','GL'),C('CYPESDA','GL'),B('Recreo'),C('LDRDALCE','EC'),C('LDRDALCE','EC'),B('Recreo'),C('EYCDCY','EC'),C('EYCDCY','EC'),B('Almuerzo'),C('CYPESDA','GL'),C('IYEDSD','GL'),C('IYEDSD','GL')],
[C('Matemática','JG'),C('Matemática','JG'),B('Recreo'),C('LDRDALCE','EC'),C('LDRDALCE','EC'),B('Recreo'),C('Educación Física'),C('Educación Física'),B('Almuerzo'),C('CYPESDA','GL'),C('CYPESDA','GL'),C('CYPESDA','GL')],
[C('EYCDCY','EC'),C('EYCDCY','EC'),B('Recreo'),C('LYEDSD','GL'),C('LYEDSD','GL'),B('Recreo'),C('Lenguaje','KM'),C('Ciencias para la Ciudadanía','JR'),B('Almuerzo'),C('Ciencias para la Ciudadanía','JR'),C('Jefatura','GL'),C('Jefatura','GL')],
[C('LDRDALCE','EC'),C('LDRDALCE','EC'),B('Recreo'),C('Taller PAES Lenguaje','KM'),C('Taller PAES Lenguaje','KM'),B('Recreo'),C('EYCDCY','EC'),C('EYCDCY','EC')]
];
const schedule=plans.flatMap((plan,idx)=>plan.map((item,i)=>({day:idx+1,start:timeSlots[i][0],end:timeSlots[i][1],...item})));
const lessonsForDay=day=>schedule.filter(item=>item.day===day).sort((a,b)=>a.start.localeCompare(b.start));
const subjects=[...new Set(schedule.filter(s=>s.type==='class').map(s=>s.subject))].sort((a,b)=>a.localeCompare(b,'es'));
function timeUntil(deadline,now=new Date()){
 const total=Math.max(0,new Date(deadline).getTime()-now.getTime())||0;
 return {total,days:Math.floor(total/86400000),hours:Math.floor(total%86400000/3600000),minutes:Math.floor(total%3600000/60000)};
}
function progress(tasks){return tasks.length?Math.round(100*tasks.filter(t=>t.done).length/tasks.length):0;}

// Métrica aproximada para una prueba local hecha con requestAnimationFrame.
function frameMetrics(timestamps){
 if(!Array.isArray(timestamps)||timestamps.length<2)return {fps:0,p95Ms:0,slowFrames:0,totalFrames:0};
 const intervals=[];
 for(let i=1;i<timestamps.length;i++){
   const dt=timestamps[i]-timestamps[i-1];
   if(Number.isFinite(dt)&&dt>0)intervals.push(dt);
 }
 if(!intervals.length)return {fps:0,p95Ms:0,slowFrames:0,totalFrames:0};
 const sorted=[...intervals].sort((a,b)=>a-b);
 const total=intervals.reduce((a,b)=>a+b,0);
 const fps=Math.round(intervals.length*10000/total)/10;
 const p95Ms=Math.round(sorted[Math.ceil(sorted.length*.95)-1]*10)/10;
 return {fps,p95Ms,slowFrames:intervals.filter(v=>v>16.7).length,totalFrames:intervals.length};
}

const STORAGE='portal-3a-local-v1';
const html=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayName=d=>days[d-1]||'Día';
const icons={home:'⌂',schedule:'▦',tasks:'☑',exams:'◷',resources:'▤',notices:'◉',settings:'⚙',more:'☷'};
const titles={home:'Inicio',schedule:'Horario',tasks:'Tareas',exams:'Evaluaciones',resources:'Materiales',notices:'Avisos',settings:'Ajustes',more:'Más'};
let state=load();let page='home';let day=(new Date().getDay()||1);if(day>5)day=1;
let toastTimer;
function load(){try{const d=JSON.parse(localStorage.getItem(STORAGE)||'{}');return {tasks:Array.isArray(d.tasks)?d.tasks:[],exams:Array.isArray(d.exams)?d.exams:[],resources:Array.isArray(d.resources)?d.resources:[],notices:Array.isArray(d.notices)?d.notices:[],notes:typeof d.notes==='string'?d.notes:'',theme:d.theme==='light'?'light':'dark'};}catch{return {tasks:[],exams:[],resources:[],notices:[],notes:'',theme:'dark'};}}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch{toast('No se pudo guardar. Revisa el almacenamiento de tu navegador.')}}
function toast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2700)}
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);
const todayLabel=()=>new Intl.DateTimeFormat('es-CL',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
const dateLabel=v=>v?new Intl.DateTimeFormat('es-CL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(v)):'Sin fecha';
const futureExams=()=>state.exams.filter(x=>timeUntil(x.date).total>0).sort((a,b)=>a.date.localeCompare(b.date));
function init(){document.documentElement.dataset.theme=state.theme;document.querySelector('#today').textContent=todayLabel();renderNav();render();if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});}
function renderNav(){const renderLink=p=>`<button type="button" class="nav-link ${page===p?'active':''}" data-page="${p}" aria-current="${page===p?'page':'false'}"><span class="nav-ico">${icons[p]}</span><span>${titles[p]}</span></button>`;document.querySelector('#nav').innerHTML=Object.keys(titles).filter(p=>p!=='more').map(renderLink).join('');document.querySelector('#bottomNav').innerHTML=['home','schedule','tasks','exams','more'].map(renderLink).join('');}
const heading=(k,txt)=>`<div class="page-head"><div class="eyebrow">3° Medio A · Técnico Profesional</div><h1>${k}</h1><p class="sub">${txt}</p></div>`;
const empty=(title,desc,ico='▢')=>`<div class="empty"><span class="empty-ico">${ico}</span><strong>${title}</strong><p>${desc}</p></div>`;
const dayTabs=()=>`<div class="day-tabs" role="group" aria-label="Seleccionar día">${days.map((d,i)=>`<button type="button" class="day-tab ${day===i+1?'active':''}" data-day="${i+1}" aria-pressed="${day===i+1}">${d}</button>`).join('')}</div>`;
const slots=(limit=999)=>`<div class="schedule-list">${lessonsForDay(day).slice(0,limit).map(s=>`<div class="slot ${s.type==='break'?'break':''}"><span class="slot-time">${s.start}<small>${s.end}</small></span><span class="bar"></span><div class="slot-title">${html(s.subject)}</div><span class="slot-teacher">${s.teacher?html(s.teacher):''}</span></div>`).join('')}</div>`;
const taskRow=t=>`<div class="task-item ${t.done?'done':''}"><input type="checkbox" data-done="${html(t.id)}" ${t.done?'checked':''} aria-label="Marcar ${html(t.title)} como completada"><div class="task-main"><div class="task-name">${html(t.title)}</div><div class="task-meta">${html(t.subject||'General')}${t.date?' · '+dateLabel(t.date):''}</div></div><button class="btn btn-sm" data-delete="tasks" data-id="${html(t.id)}" aria-label="Eliminar tarea">✕</button></div>`;
const prog=()=>`<div class="progress-label"><div><strong>${progress(state.tasks)}%</strong><span> completado</span></div><span>${state.tasks.filter(t=>t.done).length} / ${state.tasks.length} tareas</span></div><div class="progress-track"><div class="progress-fill" style="width:${progress(state.tasks)}%"></div></div>`;
const countBlock=()=>{const next=futureExams()[0];if(!next)return empty('Sin evaluaciones registradas','Agrega una fecha de evaluación para activar la cuenta regresiva.','◷');const t=timeUntil(next.date);return `<div class="small-label">${html(next.title)} · ${html(next.subject||'General')}</div><div class="countdown"><div class="cd-unit"><strong>${t.days}</strong><small>DÍAS</small></div><div class="cd-unit"><strong>${String(t.hours).padStart(2,'0')}</strong><small>HORAS</small></div><div class="cd-unit"><strong>${String(t.minutes).padStart(2,'0')}</strong><small>MINUTOS</small></div></div><div class="small-label">${dateLabel(next.date)}</div>`};
function home(){return `<section class="hero"><div><span class="hero-tag">✧ TU CENTRO DE ESTUDIOS</span><h1>Tu semana, bajo control.</h1><p>Horario completo, tareas y evaluaciones organizadas en un solo espacio. Todo listo para estudiar sin perderte nada.</p><div class="help-links"><a href="#horario" data-page="schedule">Ver horario ↗</a><a href="#tareas" data-page="tasks">Mis tareas ↗</a></div></div><div class="hero-art" aria-hidden="true">✦</div></section>
<div class="grid stats"><article class="stat"><div class="stat-top">Asignaturas <span class="stat-icon">▤</span></div><div class="stat-num">${subjects.length}</div><div class="stat-foot">En el horario semanal</div></article><article class="stat"><div class="stat-top">Tareas pendientes <span class="stat-icon">☑</span></div><div class="stat-num">${state.tasks.filter(x=>!x.done).length}</div><div class="stat-foot">Guardadas en este dispositivo</div></article><article class="stat"><div class="stat-top">Próximas pruebas <span class="stat-icon">◷</span></div><div class="stat-num">${futureExams().length}</div><div class="stat-foot">Registradas localmente</div></article></div>
<div class="grid columns"><section class="panel"><div class="panel-head"><h2>📅 Horario · ${dayName(day)}</h2><button class="btn btn-sm" data-page="schedule">Ver completo ↗</button></div>${dayTabs()}${slots(6)}</section><div class="grid"><section class="panel"><div class="panel-head"><h2>◷ Próxima evaluación</h2></div>${countBlock()}</section><section class="panel"><div class="panel-head"><h2>☑ Mi progreso</h2><button class="btn btn-sm" data-page="tasks">Mis tareas ↗</button></div>${prog()}${state.tasks.length?`<div class="task-list">${state.tasks.slice(0,3).map(taskRow).join('')}</div>`:empty('Sin tareas añadidas','Agrega tus tareas para comenzar a medir tu avance.','☑')}</section></div></div>
<div class="local-banner"><span>ⓘ</span><div><strong>Importante:</strong> Esta versión de prueba guarda tareas, materiales y avisos únicamente en el navegador de este dispositivo. Para compartir publicaciones entre todo el curso se requiere conectar autenticación y una base de datos.</div></div>`}
function schedulePage(){return `${heading('Horario semanal','Consulta las materias, profesores y descansos exactos de lunes a viernes.')}<section class="panel"><div class="panel-head"><h2>Semana completa</h2><button class="btn btn-sm" data-action="print">⎙ Imprimir</button></div>${dayTabs()}${slots()}<div class="small-label section-spacing">Las abreviaturas de las asignaturas TP se conservaron según la fotografía oficial proporcionada. El viernes termina a las 13:10.</div></section>`}
function subjectOptions(){return `<option value="">Seleccionar asignatura</option>${subjects.map(s=>`<option value="${html(s)}">${html(s)}</option>`).join('')}`}
function tasksPage(){return `${heading('Mis tareas','Organiza tus pendientes y marca cada tarea cuando la termines.')}<div class="grid columns"><section class="panel"><div class="section-title"><h2>Lista de tareas</h2><span class="tag">Privado · este dispositivo</span></div>${prog()}<div class="task-list">${state.tasks.length?state.tasks.map(taskRow).join(''):empty('Todo despejado','Todavía no tienes tareas registradas.','✓')}</div></section><section class="panel"><h2>+ Nueva tarea</h2><form id="taskForm" class="form"><label>Título<input name="title" required maxlength="120" placeholder="Ej.: terminar guía de matemática"></label><label>Asignatura<select name="subject">${subjectOptions()}</select></label><label>Fecha de entrega<input type="datetime-local" name="date"></label><button class="btn btn-primary" type="submit">Agregar tarea</button></form><p class="demo">Las tareas se guardan en este navegador. Para sincronizar tareas entre alumnos hace falta añadir autenticación y una base de datos compartida.</p></section></div>`}
function examRow(e){const t=timeUntil(e.date);return `<div class="notice"><div class="notice-header"><div><h3>${html(e.title)}</h3><p>${html(e.subject||'General')} · ${dateLabel(e.date)} ${t.total>0?' · Faltan '+t.days+' días':' · Fecha pasada'}</p></div><button class="btn btn-sm" data-delete="exams" data-id="${html(e.id)}">✕</button></div></div>`}
function examsPage(){return `${heading('Evaluaciones','Programa pruebas y controla automáticamente cuánto falta para la siguiente.')}<div class="grid columns"><section class="panel"><h2>Próxima evaluación</h2>${countBlock()}<div class="section-spacing">${state.exams.length?state.exams.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(examRow).join(''):''}</div></section><section class="panel"><h2>+ Registrar evaluación</h2><form id="examForm" class="form"><label>Nombre de la evaluación<input name="title" required maxlength="120" placeholder="Ej.: prueba de matemáticas"></label><label>Asignatura<select name="subject">${subjectOptions()}</select></label><label>Fecha y hora<input type="datetime-local" name="date" required></label><button class="btn btn-primary" type="submit">Guardar evaluación</button></form><p class="demo">Cuando pase la fecha, la cuenta regresiva mostrará automáticamente la próxima evaluación futura.</p></section></div>`}
function safeUrl(u){try{const link=new URL(u);return ['https:','http:'].includes(link.protocol)?link.href:null}catch{return null}}
function resourceRow(r){const link=safeUrl(r.url);return `<div class="resource"><span class="resource-icon">▤</span><div class="resource-body"><strong>${html(r.title)}</strong><small>${html(r.subject||'General')} · Enlace guardado</small></div>${link?`<a class="btn btn-sm" href="${html(link)}" target="_blank" rel="noopener noreferrer">Abrir ↗</a>`:''}<button class="btn btn-sm" data-delete="resources" data-id="${html(r.id)}">✕</button></div>`}
function resourcesPage(){return `${heading('Materiales de estudio','Guarda enlaces a guías, apuntes y recursos de tus asignaturas.')}<div class="grid columns"><section class="panel"><div class="section-title"><h2>Biblioteca personal</h2><span class="tag">${state.resources.length} enlaces</span></div><div class="filter-row"><input class="search" id="searchResources" placeholder="Buscar materiales..." aria-label="Buscar materiales"></div><div id="resourceList">${state.resources.length?state.resources.map(r=>`<div class="filterable">${resourceRow(r)}</div>`).join(''):empty('Sin recursos guardados','Agrega un enlace para comenzar tu biblioteca.','▤')}</div></section><section class="panel"><h2>+ Guardar recurso</h2><form id="resourceForm" class="form"><label>Nombre<input name="title" maxlength="120" required placeholder="Ej.: guía de estudio"></label><label>Asignatura<select name="subject">${subjectOptions()}</select></label><label>Enlace (https://...)<input name="url" type="url" required placeholder="https://..."></label><button class="btn btn-primary">Guardar enlace</button></form><p class="demo">Los enlaces funcionan de forma local. La subida de archivos compartidos no está configurada en esta demo.</p></section></div>`}
function noticesPage(){return `${heading('Avisos del curso','Mantén tus recordatorios en un solo lugar.')}<div class="grid columns"><section class="panel"><h2>Tablón de avisos</h2><div class="section-spacing">${state.notices.length?state.notices.slice().reverse().map(n=>`<article class="notice"><div class="notice-header"><div><h3>${html(n.title)}</h3><p>${html(n.description)}</p></div><button class="btn btn-sm" data-delete="notices" data-id="${html(n.id)}">✕</button></div></article>`).join(''):empty('No hay avisos','Publica un recordatorio para este dispositivo.','◉')}</div></section><section class="panel"><h2>+ Nuevo recordatorio</h2><form id="noticeForm" class="form"><label>Título<input name="title" maxlength="120" required></label><label>Descripción<textarea name="description" maxlength="1000" required></textarea></label><button class="btn btn-primary" type="submit">Guardar recordatorio</button></form><p class="demo">Este tablón es personal en la demo. Publicar para todos los alumnos requiere iniciar sesión como administrador en un portal compartido.</p></section></div>`}
function settingsPage(){return `${heading('Configuración','Personaliza la experiencia y controla tus datos guardados localmente.')}<div class="grid columns"><section class="panel"><h2>Preferencias</h2><div class="setting"><div><strong>Modo de visualización</strong><small>Oscuro o claro, según prefieras</small></div><button class="btn" data-action="theme">${state.theme==='dark'?'☀ Usar claro':'☾ Usar oscuro'}</button></div><div class="setting"><div><strong>Guardar mis datos</strong><small>Exporta tareas, evaluaciones, enlaces y avisos en JSON</small></div><button class="btn" data-action="export">↓ Exportar</button></div><div class="setting"><div><strong>Restaurar datos</strong><small>Importa una copia local hecha desde esta página</small></div><label class="btn" for="importFile">↑ Importar</label><input id="importFile" type="file" accept="application/json,.json" hidden></div><div class="setting"><div><strong>Borrar datos locales</strong><small>Elimina todos los registros de esta demo en este navegador</small></div><button class="btn" data-action="clear">Borrar</button></div></section><section class="panel"><h2>Mis apuntes privados</h2><p class="small-label">Tus notas se guardan automáticamente en el navegador.</p><form id="notesForm" class="form"><label>Apuntes<textarea name="notes" maxlength="10000" placeholder="Escribe aquí...">${html(state.notes)}</textarea></label><button class="btn btn-primary" type="submit">Guardar apuntes</button></form><div class="local-banner">⚡ <div>El diseño usa animaciones ligeras. Puedes medir los FPS observados por este navegador; los 120 FPS reales no están garantizados.</div></div><div class="section-spacing"><h2>Prueba de fluidez (5 segundos)</h2><p class="small-label">Ejecuta esta prueba en el celular con la pantalla configurada a 120 Hz y la pestaña visible. Se anima un indicador para detectar la frecuencia real de fotogramas entregados al navegador. Un FPS alto no garantiza ausencia de demoras al tocar botones.</p><div style="height:28px;padding:8px 16px;background:var(--panel2);border-radius:12px;margin:12px 0"><div id="fpsDot" style="width:13px;height:13px;border-radius:50%;background:var(--accent2);transform:translate3d(0,0,0)"></div></div><button type="button" class="btn btn-primary" data-action="fps">Medir fluidez</button><p id="fpsResult" class="small-label" aria-live="polite">Sin medir todavía.</p></div></section></div>`}
function morePage(){return `${heading('Más opciones','Accede a los materiales, avisos y configuración de tu portal.')}<section class="panel"><div class="grid"><button class="btn" data-page="resources">▤ Materiales de estudio →</button><button class="btn" data-page="notices">◉ Avisos y recordatorios →</button><button class="btn" data-page="settings">⚙ Configuración y apuntes →</button></div></section>`}
function render(){renderNav();document.querySelector('#crumb').innerHTML=`Portal del curso <span>/</span> ${titles[page]}`;const view={home,schedule:schedulePage,tasks:tasksPage,exams:examsPage,resources:resourcesPage,notices:noticesPage,settings:settingsPage,more:morePage};document.querySelector('#app').innerHTML=view[page]();}
function addItem(type,form){const d=new FormData(form);const title=String(d.get('title')||'').trim();if(!title)return toast('Escribe un título');const obj={id:uid(),title,subject:String(d.get('subject')||''),date:String(d.get('date')||'')};if(type==='tasks')obj.done=false;if(type==='resources'){obj.url=String(d.get('url')||'').trim();if(!safeUrl(obj.url))return toast('Usa un enlace HTTP o HTTPS válido.')}if(type==='notices')obj.description=String(d.get('description')||'').trim();state[type].push(obj);save();render();toast('Guardado en este dispositivo ✓');}
document.addEventListener('click',e=>{
 const p=e.target.closest('[data-page]');if(p){e.preventDefault();page=p.dataset.page;render();window.scrollTo({top:0,behavior:'instant'});return}
 const d=e.target.closest('[data-day]');if(d){day=Number(d.dataset.day);render();return}
 const del=e.target.closest('[data-delete]');if(del){const type=del.dataset.delete;state[type]=state[type].filter(x=>x.id!==del.dataset.id);save();render();toast('Eliminado');return}
 const action=e.target.closest('[data-action]');if(action){const a=action.dataset.action;if(a==='print')window.print();if(a==='fps')measureFps();if(a==='theme')toggleTheme();if(a==='export')exportData();if(a==='clear'&&confirm('¿Eliminar todos los registros locales de esta versión?')){state={...state,tasks:[],exams:[],resources:[],notices:[],notes:''};save();render();toast('Datos locales eliminados')}return}
});
document.addEventListener('change',e=>{if(e.target.matches('[data-done]')){const task=state.tasks.find(x=>x.id===e.target.dataset.done);if(task){task.done=e.target.checked;save();render()}}if(e.target.id==='importFile')importData(e.target.files[0]);});
document.addEventListener('input',e=>{if(e.target.id==='searchResources'){const q=e.target.value.toLocaleLowerCase('es');document.querySelectorAll('#resourceList .filterable').forEach(el=>el.hidden=!el.textContent.toLocaleLowerCase('es').includes(q));}});
document.addEventListener('submit',e=>{if(!['taskForm','examForm','resourceForm','noticeForm','notesForm'].includes(e.target.id))return;e.preventDefault();if(e.target.id==='notesForm'){state.notes=String(new FormData(e.target).get('notes')||'');save();toast('Apuntes guardados');return}addItem({taskForm:'tasks',examForm:'exams',resourceForm:'resources',noticeForm:'notices'}[e.target.id],e.target)});
document.querySelector('#themeToggle').addEventListener('click',toggleTheme);document.querySelector('#mobileBrand').addEventListener('click',()=>{page='home';render()});
function measureFps(){
 const button=document.querySelector('[data-action="fps"]');
 const result=document.querySelector('#fpsResult');
 if(!button||!result)return;
 if(document.visibilityState!=='visible'){result.textContent='Muestra la pestaña en pantalla para medir.';return;}
 button.disabled=true;result.textContent='Midiendo durante 5 segundos...';
 const times=[];let start=null;
 function tick(t){
  if(!document.querySelector('#fpsResult')||document.visibilityState!=='visible'){button.disabled=false;return;}
  if(start===null)start=t;times.push(t);
  const dot=document.querySelector('#fpsDot');
  if(dot)dot.style.transform=`translate3d(${Math.sin((t-start)/200)*35}px,0,0)`;
  if(t-start<5000){requestAnimationFrame(tick);return;}
  const m=frameMetrics(times);
  result.textContent=`FPS aproximados: ${m.fps} · P95 por fotograma: ${m.p95Ms} ms · Fotogramas de más de 16,7 ms: ${m.slowFrames}/${m.totalFrames}. Medición local, no certificación de 120 FPS.`;
  button.disabled=false;
 }
 requestAnimationFrame(tick);
}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;save();render()}
function exportData(){const file=new Blob([JSON.stringify({version:1,...state},null,2)],{type:'application/json'});const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download='portal-3medio-a-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Copia exportada');}
async function importData(file){if(!file)return;try{if(file.size>1e6)throw Error('archivo demasiado grande');const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.tasks)||!Array.isArray(data.exams)||!Array.isArray(data.resources)||!Array.isArray(data.notices))throw Error('formato no válido');const normalize=a=>a.slice(0,300).map(x=>({id:String(x.id||uid()),title:String(x.title||'').slice(0,120),subject:String(x.subject||'').slice(0,100),date:String(x.date||'').slice(0,25),done:!!x.done,url:String(x.url||'').slice(0,2000),description:String(x.description||'').slice(0,1000)}));state={...state,tasks:normalize(data.tasks),exams:normalize(data.exams),resources:normalize(data.resources),notices:normalize(data.notices),notes:String(data.notes||'').slice(0,10000)};save();render();toast('Copia local restaurada');}catch{toast('No se pudo importar el archivo JSON')}}
setInterval(()=>{if(['home','exams'].includes(page))render()},60000);
init();
</script>
</body></html>
